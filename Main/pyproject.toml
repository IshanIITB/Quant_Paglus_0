[project]
name = "catan-rl"
version = "0.1.0"
description = "Two-player Catan self-play RL agent (Catanatron + MaskablePPO)"
readme = "README.md"
requires-python = ">=3.10"   # provisional: confirm against the pinned Catanatron
license = { text = "MIT" }

# No exact pins here on purpose: `uv lock` records the resolved versions in uv.lock.
# Verify these package names and mutual compatibility during the simulator audit.
dependencies = [
  "catanatron",
  "gymnasium",
  "stable-baselines3",
  "sb3-contrib",
  "torch",
  "numpy",
  "pyyaml",
  "tensorboard",
  "pandas",
  "huggingface_hub",
]

[project.optional-dependencies]
hub = ["huggingface_sb3"]            # only if compatible with MaskablePPO
explain = ["transformers", "accelerate"]   # optional LLM explanations
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catan_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
